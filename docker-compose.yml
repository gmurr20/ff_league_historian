services:
  db:
    image: postgres:16-alpine
    container_name: ff_historian_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ff_historian
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ff_historian"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
