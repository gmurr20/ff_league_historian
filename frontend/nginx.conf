# frontend/nginx.conf - Production NGINX Web Server Configuration for Vue 3 PWA
#
# Rules:
# 1. PWA Service Worker & Manifest: Never cache (sw.js, workbox-*.js, manifest.webmanifest, index.html)
# 2. Hashed static assets: Cache immutably for 1 year (/assets/*)
# 3. SPA Fallback: Route all unmatched paths to /index.html
# 4. Optional reverse proxy: Forward /api/ requests to upstream REST API

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static text/JSON/CSS/JS assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # PWA Service Worker & Manifest: Never cache so service worker updates activate immediately
    location ~* (sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Hashed static assets: Cache immutably for 1 year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API reverse proxy: Forward /api/ requests to upstream Flask service if configured
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
